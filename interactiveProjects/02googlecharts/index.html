<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Folkevekst Simulering</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            padding: 8px 12px;
            text-align: center;
            border: 1px solid #ddd;
        }
        th {
            background-color: #f2f2f2;
        }
        .container {
            margin-top: 20px;
        }
        .controls {
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
 
    <h1>Folkevekst Simulering</h1>
 
    <div class="controls">
        <label for="columnSelect">Velg kolonne:</label>
        <select id="columnSelect">
            <option value="fødselstall">Fødselstall</option>
            <option value="innflyttinger">Innflyttinger</option>
            <option value="utflyttinger">Utflyttinger</option>
            <option value="nettoFolkevekst">Netto Folkevekst</option>
        </select>
        <br><br>
        <label for="startYear">Velg startår:</label>
        <input type="number" id="startYear" value="1945" min="1945" max="2024">
        <br><br>
        <label for="endYear">Velg sluttår:</label>
        <input type="number" id="endYear" value="2024" min="1945" max="2024">
        <br><br>
        <button onclick="updateTable()">Oppdater Tabell</button>
        <button onclick="updateChart()">Oppdater Diagram</button>
    </div>
 
    <div class="container">
        <h2>Tabell med data</h2>
        <table id="dataTable">
            <thead>
                <tr>
                    <th>År</th>
                    <th>Fødselstall</th>
                    <th>Innflyttinger</th>
                    <th>Utflyttinger</th>
                    <th>Netto Folkevekst</th>
                </tr>
            </thead>
            <tbody>
                <!-- Data vil bli lagt til her -->
            </tbody>
        </table>
 
        <h2>Diagram</h2>
        <canvas id="dataChart" width="400" height="200"></canvas>
    </div>
 
    <script>
        // Eksempel på datasett
        const data = [
            { år: 1945, fødselstall: 1200, innflyttinger: 300, utflyttinger: 200 },
            { år: 1946, fødselstall: 1300, innflyttinger: 350, utflyttinger: 180 },
            // ... Legg til flere data for andre år her
            { år: 2024, fødselstall: 950, innflyttinger: 250, utflyttinger: 150 }
        ];
 
        // Funksjon for å beregne netto folkevekst
        function calculateNettoFolkevekst(fødselstall, innflyttinger, utflyttinger) {
            return fødselstall + innflyttinger - utflyttinger;
        }
 
        // Funksjon for å oppdatere tabellen basert på valgt periode og kolonne
        function updateTable() {
            const startYear = parseInt(document.getElementById('startYear').value);
            const endYear = parseInt(document.getElementById('endYear').value);
            const column = document.getElementById('columnSelect').value;
            const tbody = document.getElementById('dataTable').getElementsByTagName('tbody')[0];
            tbody.innerHTML = '';  // Tømmer tabellen
 
            data.forEach(item => {
                if (item.år >= startYear && item.år <= endYear) {
                    const row = tbody.insertRow();
                    row.insertCell().textContent = item.år;
                    row.insertCell().textContent = item.fødselstall;
                    row.insertCell().textContent = item.innflyttinger;
                    row.insertCell().textContent = item.utflyttinger;
                    row.insertCell().textContent = calculateNettoFolkevekst(item.fødselstall, item.innflyttinger, item.utflyttinger);
                }
            });
        }
 
        // Funksjon for å oppdatere diagrammet
        function updateChart() {
            const startYear = parseInt(document.getElementById('startYear').value);
            const endYear = parseInt(document.getElementById('endYear').value);
            const column = document.getElementById('columnSelect').value;
            
            const labels = [];
            const dataPoints = [];
 
            data.forEach(item => {
                if (item.år >= startYear && item.år <= endYear) {
                    labels.push(item.år);
                    if (column === 'fødselstall') {
                        dataPoints.push(item.fødselstall);
                    } else if (column === 'innflyttinger') {
                        dataPoints.push(item.innflyttinger);
                    } else if (column === 'utflyttinger') {
                        dataPoints.push(item.utflyttinger);
                    } else if (column === 'nettoFolkevekst') {
                        dataPoints.push(calculateNettoFolkevekst(item.fødselstall, item.innflyttinger, item.utflyttinger));
                    }
                }
            });
 
            const ctx = document.getElementById('dataChart').getContext('2d');
            new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        label: column,
                        data: dataPoints,
                        borderColor: 'rgba(75, 192, 192, 1)',
                        fill: false
                    }]
                }
            });
        }
 
        // Initialisering av tabell og diagram
        updateTable();
        updateChart();
    </script>
 
</body>
</html>
