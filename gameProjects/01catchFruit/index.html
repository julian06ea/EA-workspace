<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fange Frukt Spill</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; background: #f0f0f0; }
        #gameArea { position: relative; width: 600px; height: 400px; margin: 0 auto; background-color: #87CEFA; overflow: hidden; border: 2px solid #000; }
        .basket { width: 100px; height: 20px; background-color: #8B4513; position: absolute; bottom: 0; }
        .fruit { width: 30px; height: 30px; border-radius: 50%; position: absolute; }
        .apple { background-color: red; }
        .banana { background-color: yellow; }
        #startBtn { margin-top: 20px; padding: 10px 20px; font-size: 18px; cursor: pointer; }
        .hidden { display: none; }
        .scoreboard { margin-top: 10px; font-size: 20px; }
    </style>
</head>
<body>
    <h1>Fange Frukt Spill</h1>
    <p>Bruk venstre og høyre piltaster for å fange fruktene!</p>
    <div id="gameArea">
        <div id="basket" class="basket"></div>
    </div>
    <button id="startBtn">Start Spillet</button>
    <div class="scoreboard hidden">
        <p>Poeng: <span id="score">0</span></p>
        <p>Liv: <span id="lives">3</span></p>
    </div>
    <script src="game.js"></script>
</body>
</html>
